(function patchImages() {
  if (!window.__resources || !window.SJP_PRODUCTS) return;
  const map = {
    'assets/img/cable-pulley.svg': window.__resources.cablePulley,
    'assets/img/power-cage.svg':   window.__resources.powerCage,
    'https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=800&q=80': window.__resources.beltSquatPhoto,
    'https://images.unsplash.com/photo-1581009146145-b5ef050c2e1e?w=800&q=80': window.__resources.convPressPhoto
  };
  window.SJP_PRODUCTS.forEach(p => { if (p.image && map[p.image]) p.image = map[p.image]; });
})();
</script>

function TrustBar() {

function Popular() {
  const products = SJP_POPULAR.map(id => SJP_PRODUCTS.find(p => p.id === id)).filter(Boolean);
  // duplicate to have 8
  const extras = SJP_PRODUCTS.filter(p => !SJP_POPULAR.includes(p.id)).slice(0, 2);
  const list = [...products, ...extras];

  const [idx, setIdx] = useState(0);
  const [perPage, setPerPage] = useState(4);
  useEffect(() => {
    const calc = () => {
      const w = window.innerWidth;
      if (w < 520) setPerPage(1);
      else if (w < 780) setPerPage(2);
      else if (w < 1100) setPerPage(3);
      else setPerPage(4);
    };
    calc();
    window.addEventListener('resize', calc);
    return () => window.removeEventListener('resize', calc);
  }, []);
  const maxIdx = Math.max(0, list.length - perPage);
  const go = (d) => setIdx(i => Math.max(0, Math.min(maxIdx, i + d)));
  useEffect(() => { setIdx(i => Math.min(i, maxIdx)); }, [maxIdx]);

  const progressW = ((perPage) / list.length) * 100;
  const progressL = (idx / list.length) * 100;

  return (
    <section className="section">
      <div className="wrap">
        <div className="carousel-head">
          <div className="reveal">
            <div className="eyebrow red" style={{marginBottom: 16}}>◆ 02 · Productos destacados</div>
            <h2 className="h-1">Las más pedidas<br/>de la temporada</h2>
          </div>
          <div className="right reveal delay-1">
            <a href="catalog.html" className="btn btn-outline" style={{padding: '14px 22px'}}>
              Ver todo el catálogo <SJPIcon name="arrow-right" size={14}/>
            </a>
            <div className="carousel-nav">
              <button onClick={() => go(-1)} disabled={idx === 0} aria-label="Anterior">
                <SJPIcon name="arrow-left" size={16}/>
              </button>
              <button onClick={() => go(1)} disabled={idx === maxIdx} aria-label="Siguiente">
                <SJPIcon name="arrow-right" size={16}/>
              </button>
            </div>
          </div>
        </div>

        <div className="carousel reveal delay-2">
          <div className="carousel-track" style={{
            transform: `translateX(calc(${-idx} * ((100% - ${(perPage - 1) * 24}px) / ${perPage} + 24px)))`
          }}>
            {list.map(p => <SJPProductCard key={p.id} product={p}/>)}
          </div>
        </div>

        <div className="carousel-progress">
          <div style={{ left: `${progressL}%`, width: `${progressW}%` }}/>
        </div>
      </div>
    </section>
  );
}

        <div className="manifesto-inner">
          <div className="tag-col reveal">
            <span className="stacked-num">◆ 05</span>
            <span className="stacked-num">PALABRAS</span>
          </div>
          <div>
            <h2 className="reveal">
              No hago máquinas.<br/>
              <span className="stroke">Hago herramientas</span><br/>
              de rendimiento.
            </h2>
            <p className="editable reveal delay-1">
              Este es un bloque editable. Aquí puedes escribir tu historia,
              una cita, tu filosofía, o un mensaje al visitante. El estilo
              tipográfico y el espacio están pensados para que el contenido
              respire y transmita oficio.
            </p>
            <a href="#" className="ext-link reveal delay-2" rel="noopener noreferrer" target="_blank">
              Leer entrevista completa <SJPIcon name="arrow-up-right" size={14}/>
            </a>
          </div>
        </div>
      </div>
    </section>
  );
}

/* ============================================
   Tweaks panel
   ============================================ */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentColor": "#DC1F1F",
  "inkShade": "deep",
  "density": "compact",
  "showGridMarks": true
}/*EDITMODE-END*/;

function TweaksPanel({ visible, values, onChange }) {
  if (!visible) return null;
  const set = (k, v) => onChange({ ...values, [k]: v });
  return (
    <div style={{
      position: 'fixed', right: 20, bottom: 20, zIndex: 9999,
      width: 300, background: 'var(--ink)', color: 'var(--paper)',
      border: '1px solid rgba(255,255,255,0.15)',
      padding: 20, fontFamily: 'var(--f-sans)',
      boxShadow: '0 20px 60px rgba(0,0,0,0.6)'
    }}>
      <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom: 16, borderBottom: '1px solid rgba(255,255,255,0.1)', paddingBottom: 12}}>
        <div style={{fontFamily:'var(--f-mono)', fontSize: 11, letterSpacing: '0.15em'}}>◆ TWEAKS</div>
        <div style={{fontFamily:'var(--f-mono)', fontSize: 10, color: 'var(--steel)'}}>SJP</div>
      </div>

      <div style={{marginBottom: 16}}>
        <div style={{fontFamily:'var(--f-mono)', fontSize: 10, letterSpacing: '0.12em', color:'var(--steel)', marginBottom: 8}}>ACENTO</div>
        <div style={{display: 'flex', gap: 6}}>
          {[
            { v: '#DC1F1F', name: 'rojo' },
            { v: '#E85A1A', name: 'naranja' },
            { v: '#D4AF37', name: 'acero' },
            { v: '#FFFFFF', name: 'blanco' }
          ].map(c => (
            <button key={c.v} onClick={() => set('accentColor', c.v)}
              style={{
                width: 32, height: 32, background: c.v,
                border: values.accentColor === c.v ? '2px solid white' : '1px solid rgba(255,255,255,0.2)',
                cursor: 'pointer'
              }} title={c.name}/>
          ))}
        </div>
      </div>

      <div style={{marginBottom: 16}}>
        <div style={{fontFamily:'var(--f-mono)', fontSize: 10, letterSpacing: '0.12em', color:'var(--steel)', marginBottom: 8}}>NEGRO</div>
        <div style={{display:'flex', gap:6}}>
          {[['deep','#0A0A0A'], ['graphite','#1C1C1E'], ['soft','#262626']].map(([id, col]) => (
            <button key={id} onClick={() => set('inkShade', id)}
              style={{
                flex:1, padding: '8px', background: col,
                border: values.inkShade === id ? '1px solid var(--red)' : '1px solid rgba(255,255,255,0.15)',
                color:'var(--paper)', fontFamily:'var(--f-mono)', fontSize: 10,
                textTransform:'uppercase', letterSpacing: '0.1em'
              }}>{id}</button>
          ))}
        </div>
      </div>

      <div style={{marginBottom: 16}}>
        <div style={{fontFamily:'var(--f-mono)', fontSize: 10, letterSpacing: '0.12em', color:'var(--steel)', marginBottom: 8}}>DENSIDAD</div>
        <div style={{display:'flex', gap:6}}>
          {['compact','regular','spacious'].map(d => (
            <button key={d} onClick={() => set('density', d)}
              style={{
                flex:1, padding: '8px', background: values.density === d ? 'var(--red)' : 'transparent',
                border: '1px solid rgba(255,255,255,0.2)',
                color:'var(--paper)', fontFamily:'var(--f-mono)', fontSize: 10,
                textTransform:'uppercase', letterSpacing: '0.08em'
              }}>{d}</button>
          ))}
        </div>
      </div>

      <div>
        <label style={{display:'flex', alignItems:'center', gap: 10, cursor:'pointer'}}>
          <input type="checkbox" checked={values.showGridMarks}
            onChange={(e) => set('showGridMarks', e.target.checked)}/>
          <span style={{fontFamily:'var(--f-mono)', fontSize: 10, letterSpacing: '0.12em', textTransform:'uppercase'}}>Marcas técnicas</span>
        </label>
      </div>
    </div>
  );
}

function App() {
  const ref = useRef(null);
  useReveal(ref);
  useLang();
  const [, force] = useState(0);
  useEffect(() => {
    const onLang = () => force(n => n + 1);
    window.addEventListener('sjp-lang-change', onLang);
    return () => window.removeEventListener('sjp-lang-change', onLang);
  }, []);

  const [tweaksVisible, setTweaksVisible] = useState(false);
  const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);

  useEffect(() => {
    const onMsg = (e) => {
      if (!e.data || !e.data.type) return;
      if (e.data.type === '__activate_edit_mode') setTweaksVisible(true);
      if (e.data.type === '__deactivate_edit_mode') setTweaksVisible(false);
    };
    window.addEventListener('message', onMsg);
    try { window.parent.postMessage({type:'__edit_mode_available'}, '*'); } catch(e){}
    return () => window.removeEventListener('message', onMsg);
  }, []);

  useEffect(() => {
    document.documentElement.style.setProperty('--red', tweaks.accentColor);
    document.documentElement.style.setProperty('--red-deep',
      tweaks.accentColor === '#DC1F1F' ? '#B31818' :
      tweaks.accentColor === '#E85A1A' ? '#B8460F' :
      tweaks.accentColor === '#D4AF37' ? '#A88A24' : '#CCCCCC');
    const inkMap = { deep:'#0A0A0A', graphite:'#1C1C1E', soft:'#262626' };
    document.documentElement.style.setProperty('--ink', inkMap[tweaks.inkShade] || '#0A0A0A');
    document.body.dataset.density = tweaks.density;
    document.body.dataset.gridmarks = tweaks.showGridMarks;
  }, [tweaks]);

  const onTweakChange = (v) => {
    setTweaks(v);
    try { window.parent.postMessage({type:'__edit_mode_set_keys', edits: v}, '*'); } catch(e){}
  };

  return (
    <div ref={ref}>
      <SJPNav active="home"/>
      <Hero/>
      <TrustBar/>
      <Popular/>
      <Categories/>
      <GripCTA/>
      <SJPMarquee/>
      <Manifesto/>
      <SJPFooter/>
      <TweaksPanel visible={tweaksVisible} values={tweaks} onChange={onTweakChange}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
