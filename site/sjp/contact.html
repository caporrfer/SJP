<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Contacto — SJP Strength Generation</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="assets/styles.css?v=20260504h"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
.c-hero {
  background: var(--ink); color: var(--paper);
  padding: 80px 0 72px;
}
.c-hero h1 {
  font-size: clamp(52px, 9vw, 128px);
  font-weight: 800; line-height: 0.9;
  letter-spacing: -0.02em; text-transform: uppercase;
}
.c-hero h1 em { font-style: normal; color: var(--red); }

.contact-grid {
  padding: clamp(72px, 9vw, 120px) 0;
  display: grid; grid-template-columns: 1.3fr 1fr;
  gap: 80px;
}
.contact-card {
  display: block;
  padding: 36px 32px;
  border: 1px solid var(--steel-line);
  margin-bottom: -1px;
  transition: all 0.2s;
}
.contact-card:hover {
  background: var(--ink); color: var(--paper);
  border-color: var(--ink);
}
.contact-card:hover .c-sub { color: var(--steel-dim); }
.contact-card:hover .c-arrow { transform: translate(4px, -4px); color: var(--red); }
.contact-card .row {
  display: grid; grid-template-columns: 56px 1fr 32px;
  align-items: center;
  gap: 20px;
}
.contact-card .icn {
  width: 56px; height: 56px;
  background: var(--paper-2);
  display: grid; place-items: center;
  color: var(--ink);
  transition: all 0.2s;
}
.contact-card:hover .icn { background: var(--red); color: var(--paper); }
.contact-card .c-t {
  font-size: 20px; font-weight: 700;
  text-transform: uppercase; letter-spacing: -0.005em;
}
.contact-card .c-sub {
  font-family: var(--f-mono);
  font-size: 11px; letter-spacing: 0.12em;
  color: var(--steel); text-transform: uppercase;
  margin-top: 4px;
}
.c-arrow { transition: transform 0.25s var(--ease-out); color: var(--steel); }

.contact-aside {
  padding: 36px;
  background: var(--paper-2);
  display: flex; flex-direction: column; gap: 24px;
  height: fit-content;
}
.contact-aside h3 {
  font-size: 22px; font-weight: 800;
  text-transform: uppercase; letter-spacing: -0.005em;
}
.hour-row {
  display: flex; justify-content: space-between;
  padding: 12px 0;
  border-top: 1px solid var(--steel-line);
  font-family: var(--f-mono);
  font-size: 12px; letter-spacing: 0.08em;
  text-transform: uppercase;
}
.hour-row .day { color: var(--ink); font-weight: 500; }
.hour-row .h { color: var(--steel); }

@media (max-width: 900px) { .contact-grid { grid-template-columns: 1fr; gap: 40px; } }
@media (max-width: 520px) {
  .c-hero,
  .address-band,
  .socials-band,
  .socials-band .wrap > div:first-child {
    text-align: center;
  }
  .c-hero p,
  .address-grid p {
    margin-left: auto;
    margin-right: auto;
    max-width: none;
    width: 100%;
  }
  .contact-grid { padding: 48px 0 64px; gap: 28px; }
  .contact-card { padding: 24px 18px; }
  .contact-card .row { grid-template-columns: 44px 1fr; gap: 14px; }
  .contact-card .row > .c-arrow { display: none; }
  .contact-card .icn { width: 44px; height: 44px; }
  .contact-card .c-t { font-size: 16px; }
  .contact-aside { padding: 22px 18px; gap: 18px; text-align: center; }
  .hour-row { gap: 12px; font-size: 10px; }
}

.address-band {
  background: var(--ink); color: var(--paper);
  padding: clamp(72px, 8vw, 120px) 0;
}
.address-grid {
  display: grid; grid-template-columns: 1.4fr 1fr;
  gap: 80px; align-items: center;
}
.address-grid h2 {
  font-size: clamp(32px, 4vw, 56px);
  font-weight: 800; line-height: 1.02;
  letter-spacing: -0.015em; text-transform: uppercase;
}
.address-grid h2 .red { color: var(--red); }
.address-grid .addr-box {
  border: 1px solid rgba(255,255,255,0.12);
  padding: 28px 32px;
  display: flex; flex-direction: column; gap: 12px;
}
.address-grid .addr-box .mono {
  font-family: var(--f-mono); font-size: 11px;
  letter-spacing: 0.14em; color: var(--red);
  text-transform: uppercase;
}
.address-grid .addr-box p { font-size: 15px; line-height: 1.55; color: var(--paper); }
@media (max-width: 800px) { .address-grid { grid-template-columns: 1fr; gap: 32px; } }
@media (max-width: 520px) {
  .address-grid .addr-box { padding: 20px 18px; }
}

.socials-band {
  padding: clamp(72px, 9vw, 120px) 0;
}
.socials-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
  margin-top: 48px;
}
.social-card {
  padding: 32px;
  border: 1px solid var(--steel-line);
  display: flex; flex-direction: column; gap: 20px;
  min-height: 200px; justify-content: space-between;
  transition: all 0.25s;
}
.social-card:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.social-card:hover .sc-handle { color: var(--red); }
.sc-icon {
  width: 44px; height: 44px;
  display: grid; place-items: center;
  background: var(--paper-2); color: var(--ink);
  transition: all 0.25s;
}
.social-card:hover .sc-icon { background: var(--red); color: var(--paper); }
.sc-name {
  font-size: 18px; font-weight: 700;
  text-transform: uppercase; letter-spacing: -0.005em;
}
.sc-handle {
  font-family: var(--f-mono);
  font-size: 11px; letter-spacing: 0.12em;
  color: var(--steel); text-transform: uppercase;
}
@media (max-width: 900px) { .socials-grid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 480px) { .socials-grid { grid-template-columns: 1fr; } }
@media (max-width: 520px) {
  .socials-grid { margin-top: 28px; gap: 12px; }
  .social-card { min-height: 0; padding: 22px 18px; gap: 16px; }
  .social-card { text-align: center; align-items: center; }
}
</style>
</head>
<body>
<div id="root"></div>
<script src="assets/data.js?v=20260504d"></script>
<script src="assets/i18n.js?v=20260504d"></script>
<script src="assets/placeholders.js?v=20260504d"></script>
<script type="text/babel" src="assets/components.jsx?v=20260504d"></script>
<script type="text/babel" data-presets="env,react">
const { useRef } = React;

function Hero() {
  return (
    <section className="c-hero">
      <div className="wrap">
        <div className="eyebrow" style={{color:'var(--red)', marginBottom: 24}}>{t('con.eye')}</div>
        <h1 className="reveal">{t('con.t1')}<br/><em>{t('con.t2')}</em></h1>
        <p className="body-lg reveal delay-1" style={{color:'var(--steel-dim)', marginTop: 32, maxWidth: '52ch'}}>
          {t('con.lede')}
        </p>
      </div>
    </section>
  );
}

function ContactCards() {
  const items = window.SJP_LANG === 'en' ? [
    { icon: 'whatsapp', name: 'WhatsApp',  value: '+34 600 000 000', sub: 'Reply in ~2h', href: 'https://wa.me/34600000000' },
    { icon: 'mail',     name: 'Email',     value: 'sjpgeneration00@gmail.com', sub: 'Reply in 24h', href: 'mailto:sjpgeneration00@gmail.com' },
    { icon: 'phone',    name: 'Phone',     value: '+34 910 000 000', sub: 'Mon–Fri · 9am–6pm', href: 'tel:+34910000000' }
  ] : [
    { icon: 'whatsapp', name: 'WhatsApp',  value: '+34 600 000 000', sub: 'Respuesta en ~2h', href: 'https://wa.me/34600000000' },
    { icon: 'mail',     name: 'Email',     value: 'sjpgeneration00@gmail.com', sub: 'Respuesta en 24h', href: 'mailto:sjpgeneration00@gmail.com' },
    { icon: 'phone',    name: 'Teléfono',  value: '+34 910 000 000', sub: 'Lun–Vie · 9h–18h', href: 'tel:+34910000000' }
  ];
  return (
    <section className="wrap">
      <div className="contact-grid">
        <div>
          <div className="eyebrow red" style={{marginBottom: 16}}>{t('con.cardsEye')}</div>
          <h2 className="h-1 reveal" style={{marginBottom: 40}}>{t('con.cardsT1')}<br/>{t('con.cardsT2')}</h2>
          <div>
            {items.map((it, i) => (
              <a key={i} href={it.href} className="contact-card reveal" style={{transitionDelay: `${i * 0.05}s`}}>
                <div className="row">
                  <div className="icn"><SJPIcon name={it.icon} size={22}/></div>
                  <div>
                    <div className="c-t">{it.name}</div>
                    <div style={{fontSize: 15, marginTop: 4}}>{it.value}</div>
                    <div className="c-sub">{it.sub}</div>
                  </div>
                  <div className="c-arrow"><SJPIcon name="arrow-up-right" size={20}/></div>
                </div>
              </a>
            ))}
          </div>
        </div>
        <aside className="contact-aside reveal delay-2">
          <div className="eyebrow red">{window.SJP_LANG === 'en' ? '◆ HOURS' : '◆ HORARIO'}</div>
          <h3>{window.SJP_LANG === 'en' ? 'Workshop &\noffice.' : 'Taller &\noficina.'}</h3>
          <div>
            {(window.SJP_LANG === 'en' ? [
              ['Monday', '09:00 – 18:00'],
              ['Tuesday', '09:00 – 18:00'],
              ['Wednesday', '09:00 – 18:00'],
              ['Thursday', '09:00 – 18:00'],
              ['Friday', '09:00 – 14:00'],
              ['Saturday', 'By appointment'],
              ['Sunday', 'Closed']
            ] : [
              ['Lunes', '09:00 – 18:00'],
              ['Martes', '09:00 – 18:00'],
              ['Miércoles', '09:00 – 18:00'],
              ['Jueves', '09:00 – 18:00'],
              ['Viernes', '09:00 – 14:00'],
              ['Sábado', 'Cita previa'],
              ['Domingo', 'Cerrado']
            ]).map((r, i) => (
              <div key={i} className="hour-row" style={i === 6 ? {borderBottom: '1px solid var(--steel-line)'} : {}}>
                <span className="day">{r[0]}</span>
                <span className="h">{r[1]}</span>
              </div>
            ))}
          </div>
          <p className="body-sm" style={{color:'var(--ink-2)'}}>
            {window.SJP_LANG === 'en' ? 'If you need to visit the workshop in person, give me 24h notice so I can be there.' : 'Si necesitas visitar el taller en persona, avísame con 24h de antelación para asegurarme que estoy.'}
          </p>
        </aside>
      </div>
    </section>
  );
}

function AddressBand() {
  return (
    <section className="address-band" id="address">
      <div className="wrap">
        <div className="address-grid">
          <div>
            <div className="eyebrow" style={{color:'var(--red)', marginBottom: 16}}>◆ 02 · TALLER</div>
            <h2 className="reveal">Donde el acero<br/>se convierte en<br/><span className="red">máquina.</span></h2>
            <p className="body-lg reveal delay-1" style={{color:'var(--steel-dim)', marginTop: 24, maxWidth: '48ch'}}>
              200m² de taller propio en la zona industrial de Madrid. Corte láser, soldadura TIG, pulido, cabina de pintura. Todo bajo un mismo techo.
            </p>
          </div>
          <div className="addr-box reveal delay-2">
            <span className="mono">◆ DIRECCIÓN</span>
            <p><b>SJP Strength Generation S.L.</b><br/>
            C/ de la Industria, 12 · Nave 4<br/>
            28021 Madrid · España</p>
            <span className="mono" style={{marginTop: 12}}>◆ COORDENADAS</span>
            <p style={{fontFamily:'var(--f-mono)', fontSize: 13, letterSpacing:'0.04em'}}>
              40.4168° N<br/>03.7038° W
            </p>
            <a href="https://maps.google.com" target="_blank" className="btn btn-red" style={{marginTop: 16}}>
              Abrir en Maps <SJPIcon name="arrow-up-right" size={14}/>
            </a>
          </div>
        </div>
      </div>
    </section>
  );
}

function Socials() {
  const s = [
    { icon: 'instagram', name: 'Instagram', handle: '@sjpstrength', href: '#' },
    { icon: 'youtube',   name: 'YouTube',   handle: '/SJPStrength', href: '#' },
    { icon: 'tiktok',    name: 'TikTok',    handle: '@sjpstrength', href: '#' },
    { icon: 'whatsapp',  name: 'WhatsApp',  handle: window.SJP_LANG === 'en' ? 'Direct chat' : 'Chat directo', href: 'https://wa.me/34600000000' }
  ];
  return (
    <section className="socials-band">
      <div className="wrap">
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'end', flexWrap:'wrap', gap: 24}}>
          <div>
            <div className="eyebrow red" style={{marginBottom: 16}}>{t('con.socEye')}</div>
            <h2 className="h-1 reveal">{t('con.socT1')}<br/>{t('con.socT2')}</h2>
          </div>
          <p className="body-lg reveal delay-1" style={{maxWidth: '36ch'}}>
            {t('con.socLede')}
          </p>
        </div>
        <div className="socials-grid">
          {s.map((sc, i) => (
            <a key={sc.name} href={sc.href} className="social-card reveal" style={{transitionDelay: `${i * 0.05}s`}} target="_blank" rel="noreferrer">
              <div className="sc-icon"><SJPIcon name={sc.icon} size={20}/></div>
              <div>
                <div className="sc-name">{sc.name}</div>
                <div className="sc-handle" style={{marginTop: 6}}>{sc.handle}</div>
              </div>
            </a>
          ))}
        </div>
      </div>
    </section>
  );
}

function App() {
  const ref = useRef(null);
  useReveal(ref);
  useLang();
  return (
    <div ref={ref}>
      <SJPNav active="contact"/>
      <Hero/>
      <ContactCards/>
      <Socials/>
      {/* AddressBand removed */}
      <SJPFooter/>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
