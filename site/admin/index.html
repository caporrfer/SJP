<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Admin · SJP</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/assets/styles.css"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="/assets/i18n.js"></script>
<script src="/assets/placeholders.js"></script>
<style>
body { background: #0E0E0E; color: #FAFAF7; font-family: var(--f-sans); }
.admin-shell { min-height: 100vh; display: flex; flex-direction: column; }
.admin-top {
  background: #050505; border-bottom: 1px solid #1F1F1F;
  padding: 16px 32px; display: flex; align-items: center; justify-content: space-between;
}
.admin-top .brand { display: flex; align-items: center; gap: 14px; }
.admin-top .brand .mk {
  width: 36px; height: 36px; background: #DC1F1F; color: #FAFAF7;
  display: grid; place-items: center; font-weight: 800; font-size: 17px;
}
.admin-top .brand b { font-size: 14px; letter-spacing: 0.04em; text-transform: uppercase; }
.admin-top .brand small { display: block; font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.16em; color: #8A8A85; text-transform: uppercase; }
.admin-top .actions { display: flex; gap: 10px; align-items: center; }
.admin-tabs {
  display: flex; gap: 0; background: #0A0A0A; border-bottom: 1px solid #1F1F1F;
}
.admin-tabs button {
  padding: 18px 28px; background: none; color: #8A8A85;
  font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.14em;
  text-transform: uppercase; border: none; cursor: pointer;
  border-bottom: 2px solid transparent; transition: all 0.2s;
}
.admin-tabs button.on { color: #FAFAF7; border-bottom-color: #DC1F1F; }
.admin-tabs button:hover:not(.on) { color: #FAFAF7; }
.admin-body { padding: 32px; flex: 1; max-width: 1400px; margin: 0 auto; width: 100%; box-sizing: border-box; }

/* LOGIN */
.login-wrap {
  min-height: 100vh; display: grid; place-items: center; padding: 32px;
}
.login-card {
  width: 100%; max-width: 440px;
  background: #0A0A0A; border: 1px solid #1F1F1F;
  padding: 48px 40px;
}
.login-card .lk-mark {
  width: 56px; height: 56px; background: #DC1F1F; color: #FAFAF7;
  display: grid; place-items: center; font-weight: 800; font-size: 24px;
  margin-bottom: 28px;
}
.login-card h1 { font-size: 28px; font-weight: 800; text-transform: uppercase; letter-spacing: -0.01em; line-height: 1; }
.login-card p { color: #8A8A85; font-size: 13px; margin: 12px 0 32px; line-height: 1.5; }
.login-card label { display: block; font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.14em; color: #8A8A85; text-transform: uppercase; margin-bottom: 8px; }
.login-card input {
  width: 100%; padding: 14px 16px; background: #050505;
  border: 1px solid #1F1F1F; color: #FAFAF7; font-size: 15px;
  font-family: var(--f-sans); outline: none; transition: border 0.2s; box-sizing: border-box;
}
.login-card input:focus { border-color: #FAFAF7; }
.login-card .err { color: #DC1F1F; font-family: var(--f-mono); font-size: 11px; margin-top: 12px; letter-spacing: 0.08em; min-height: 16px; }
.login-card button {
  width: 100%; padding: 14px; background: #DC1F1F; color: #FAFAF7;
  border: none; font-weight: 700; font-size: 13px; letter-spacing: 0.1em;
  text-transform: uppercase; cursor: pointer; margin-top: 16px;
  transition: background 0.2s;
}
.login-card button:hover:not(:disabled) { background: #FAFAF7; color: #0A0A0A; }
.login-card button:disabled { opacity: 0.5; cursor: not-allowed; }
.login-card .hint { font-family: var(--f-mono); font-size: 10px; color: #6A6A65; margin-top: 24px; letter-spacing: 0.06em; line-height: 1.6; }

/* BUTTONS */
.btn-admin {
  padding: 9px 16px; font-family: var(--f-mono); font-size: 11px;
  letter-spacing: 0.1em; text-transform: uppercase;
  background: #FAFAF7; color: #0A0A0A; border: none; cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px; transition: all 0.2s;
}
.btn-admin:hover:not(:disabled) { background: #DC1F1F; color: #FAFAF7; }
.btn-admin:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-admin.ghost { background: transparent; color: #FAFAF7; border: 1px solid #2A2A2A; }
.btn-admin.ghost:hover { background: #1A1A1A; }
.btn-admin.danger { background: transparent; color: #DC1F1F; border: 1px solid #DC1F1F; }
.btn-admin.danger:hover { background: #DC1F1F; color: #FAFAF7; }

.section-h {
  display: flex; align-items: end; justify-content: space-between;
  padding-bottom: 20px; border-bottom: 1px solid #1F1F1F; margin-bottom: 24px;
}
.section-h h2 { font-size: 24px; font-weight: 800; text-transform: uppercase; letter-spacing: -0.01em; }
.section-h .meta { font-family: var(--f-mono); font-size: 11px; color: #8A8A85; letter-spacing: 0.12em; text-transform: uppercase; }

/* PRODUCTS TABLE */
.prod-table { width: 100%; border-collapse: collapse; }
.prod-table th, .prod-table td {
  text-align: left; padding: 12px 14px;
  border-bottom: 1px solid #1F1F1F; font-size: 13px;
}
.prod-table th { font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #8A8A85; font-weight: 500; }
.prod-table tr:hover td { background: #0A0A0A; }
.prod-table .thumb { width: 56px; height: 40px; background: #1A1A1A; background-size: cover; background-position: center; }
.prod-table .code { font-family: var(--f-mono); font-size: 11px; color: #DC1F1F; letter-spacing: 0.08em; }
.prod-table .star { font-size: 14px; }
.prod-table .actions { display: flex; gap: 6px; }
.prod-table .actions button {
  padding: 6px 10px; font-size: 10px; font-family: var(--f-mono);
  letter-spacing: 0.1em; text-transform: uppercase;
  background: #1A1A1A; border: none; color: #FAFAF7; cursor: pointer; transition: all 0.2s;
}
.prod-table .actions button:hover { background: #DC1F1F; }

/* LOADING */
.loading {
  padding: 60px 20px; text-align: center; color: #6A6A65;
  font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
}

/* MODAL FORM */
.adm-modal-bd {
  position: fixed; inset: 0; background: rgba(0,0,0,0.85);
  display: grid; place-items: center; z-index: 100; padding: 32px;
}
.adm-modal {
  background: #0A0A0A; border: 1px solid #2A2A2A;
  width: 100%; max-width: 720px;
  max-height: 90vh; overflow: auto;
}
.adm-modal-h {
  padding: 24px 32px; border-bottom: 1px solid #1F1F1F;
  display: flex; justify-content: space-between; align-items: center;
}
.adm-modal-h h3 { font-size: 18px; text-transform: uppercase; letter-spacing: -0.005em; font-weight: 800; }
.adm-modal-h button { background: none; border: none; color: #FAFAF7; cursor: pointer; font-size: 22px; }
.adm-modal-bod { padding: 28px 32px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.adm-modal-bod .full { grid-column: 1 / -1; }
.adm-modal-bod label { display: block; font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.14em; color: #8A8A85; text-transform: uppercase; margin-bottom: 6px; }
.adm-modal-bod input, .adm-modal-bod select, .adm-modal-bod textarea {
  width: 100%; padding: 11px 14px; background: #050505;
  border: 1px solid #1F1F1F; color: #FAFAF7; font-size: 13px;
  font-family: var(--f-sans); outline: none; box-sizing: border-box;
}
.adm-modal-bod input:focus, .adm-modal-bod textarea:focus, .adm-modal-bod select:focus { border-color: #FAFAF7; }
.adm-modal-bod textarea { min-height: 90px; resize: vertical; font-family: var(--f-sans); }
.adm-modal-bod .preview {
  width: 100%; height: 160px; background: #050505; border: 1px solid #1F1F1F;
  background-size: cover; background-position: center;
}
.adm-modal-f { padding: 20px 32px; border-top: 1px solid #1F1F1F; display: flex; gap: 10px; justify-content: flex-end; }

/* TEXTS */
.texts-list {
  display: grid; grid-template-columns: 220px 1fr 1fr; gap: 1px;
  background: #1F1F1F; border: 1px solid #1F1F1F;
}
.texts-list .h, .texts-list .c { background: #0A0A0A; padding: 12px 14px; font-size: 12px; }
.texts-list .h { font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #8A8A85; }
.texts-list textarea { width: 100%; background: transparent; border: none; color: #FAFAF7; font-size: 12px; font-family: var(--f-sans); resize: vertical; min-height: 28px; outline: none; }
.texts-list .key { font-family: var(--f-mono); font-size: 11px; color: #DC1F1F; letter-spacing: 0.06em; }
.texts-search {
  width: 100%; padding: 12px 16px; background: #050505;
  border: 1px solid #1F1F1F; color: #FAFAF7; font-size: 13px; outline: none;
  margin-bottom: 16px; box-sizing: border-box;
}

/* TOAST */
.toast {
  position: fixed; bottom: 24px; right: 24px; z-index: 200;
  padding: 14px 20px; background: #1F1F1F; color: #FAFAF7;
  font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.14em;
  text-transform: uppercase;
  animation: slideIn 0.3s;
}
.toast.ok  { background: #1A3A1A; border-left: 3px solid #4CAF50; }
.toast.err { background: #3A1A1A; border-left: 3px solid #DC1F1F; }
@keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.empty { padding: 60px 20px; text-align: center; color: #6A6A65; font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; }

/* MOBILE */
@media (max-width: 760px) {
  .admin-top { padding: 12px 16px; flex-wrap: wrap; gap: 10px; }
  .admin-top .brand { gap: 10px; }
  .admin-top .brand .mk { width: 30px; height: 30px; font-size: 14px; }
  .admin-top .brand b { font-size: 12px; }
  .admin-top .brand small { display: none; }
  .admin-top .actions { gap: 6px; flex-wrap: wrap; }
  .admin-top .actions .btn-admin { padding: 7px 12px; font-size: 10px; }
  .admin-tabs { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .admin-tabs button { padding: 14px 18px; flex-shrink: 0; white-space: nowrap; }
  .admin-body { padding: 20px 16px; }
  .section-h { flex-direction: column; align-items: flex-start; gap: 10px; padding-bottom: 16px; margin-bottom: 18px; }
  .section-h h2 { font-size: 20px; }
  .prod-table thead { display: none; }
  .prod-table, .prod-table tbody, .prod-table tr, .prod-table td { display: block; width: 100%; }
  .prod-table tr {
    background: #0A0A0A; border: 1px solid #1F1F1F; margin-bottom: 12px; padding: 14px;
    display: grid; grid-template-columns: 56px 1fr; gap: 10px 14px; align-items: start;
  }
  .prod-table tr:hover td { background: transparent; }
  .prod-table td { border: none; padding: 0; font-size: 13px; }
  .prod-table td:nth-child(1) { grid-row: 1 / 4; }
  .prod-table td:nth-child(1) .thumb { width: 56px; height: 56px; }
  .prod-table td:nth-child(n+5) { grid-column: 2; padding-left: 0; }
  .prod-table td:last-child { grid-column: 1 / -1; padding-top: 8px; border-top: 1px solid #1F1F1F; margin-top: 4px; }
  .prod-table .actions { flex-wrap: wrap; }
  .prod-table .actions button { flex: 1 1 auto; min-width: 60px; }
  .adm-modal-bd { padding: 0; }
  .adm-modal { max-height: 100vh; height: 100vh; max-width: 100%; }
  .adm-modal-h { padding: 16px 20px; }
  .adm-modal-bod { padding: 20px; grid-template-columns: 1fr; gap: 14px; }
  .adm-modal-f { padding: 14px 20px; flex-wrap: wrap; }
  .adm-modal-f .btn-admin { flex: 1 1 auto; justify-content: center; }
  .texts-list { grid-template-columns: 1fr; }
  .texts-list .h:nth-child(1)::after { content: ' / ES / EN'; }
  .texts-list .h:nth-child(2), .texts-list .h:nth-child(3) { display: none; }
  .texts-list .c { border-top: 1px solid #1F1F1F; }
  .texts-list .c:nth-child(3n+2)::before { content: 'ES — '; font-family: var(--f-mono); font-size: 10px; color: #8A8A85; letter-spacing: 0.12em; display: block; margin-bottom: 6px; }
  .texts-list .c:nth-child(3n+3)::before { content: 'EN — '; font-family: var(--f-mono); font-size: 10px; color: #8A8A85; letter-spacing: 0.12em; display: block; margin-bottom: 6px; }
  .login-card { padding: 36px 24px; }
  .login-card h1 { font-size: 22px; }
}
@media (max-width: 420px) {
  .toast { left: 12px; right: 12px; bottom: 12px; text-align: center; }
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="env,react">
const { useState, useEffect, useCallback } = React;

/* ── API helper ─────────────────────────────────────────────────────────── */
async function api(method, url, body) {
  const headers = {};
  if (body !== undefined) headers['Content-Type'] = 'application/json';
  const resp = await fetch(url, {
    method,
    headers,
    body: body !== undefined ? JSON.stringify(body) : undefined
  });
  if (!resp.ok) {
    const txt = await resp.text().catch(() => `HTTP ${resp.status}`);
    throw new Error(txt);
  }
  return resp.json().catch(() => ({}));
}

/* ── LOGIN ──────────────────────────────────────────────────────────────── */
function Login({ onIn }) {
  const [pwd, setPwd]       = useState('');
  const [err, setErr]       = useState('');
  const [busy, setBusy]     = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    setBusy(true);
    setErr('');
    try {
      const { token } = await api('POST', '/api/auth', { password: pwd });
      sessionStorage.setItem(TOKEN_KEY, token);
      onIn();
    } catch (_) {
      setErr('◆ Acceso denegado');
      setPwd('');
    } finally {
      setBusy(false);
    }
  };

  return (
    <div className="login-wrap">
      <form className="login-card" onSubmit={submit}>
        <div className="lk-mark">S</div>
        <h1>Panel<br/>de admin.</h1>
        <p>Acceso restringido. Introduce la clave para gestionar el catálogo de SJP Strength Generation.</p>
        <label>Contraseña</label>
        <input
          type="password" autoFocus
          value={pwd}
          onChange={e => { setPwd(e.target.value); setErr(''); }}
        />
        <div className="err">{err}</div>
        <button type="submit" disabled={busy}>{busy ? 'Verificando…' : 'Entrar →'}</button>
        <div className="hint">
          ◆ Esta página no aparece en el menú público.<br/>
          ◆ Los cambios se guardan en el servidor.
        </div>
      </form>
    </div>
  );
}

/* ── PRODUCT FORM ───────────────────────────────────────────────────────── */
function ProductForm({ product, onSave, onClose }) {
  const { useRef } = React;
  const isNew = !product;
  const [f, setF] = useState(product || {
    id:       'sp-' + Date.now().toString().slice(-6),
    code:     'SJP-' + Date.now().toString().slice(-3),
    kind:     'generic',
    name:     '',
    cat:      'pecho',
    price:    0,
    tag:      '',
    video:    false,
    desc:     '',
    image:    '',
    featured: false
  });
  const [busy,      setBusy]      = useState(false);
  const [uploading, setUploading] = useState(false);
  const [uploadErr, setUploadErr] = useState('');
  const fileRef = useRef(null);

  const set = (k, v) => setF(s => ({ ...s, [k]: v }));

  const handleFile = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setUploading(true);
    setUploadErr('');
    try {
      const fd = new FormData();
      fd.append('file', file);
      const resp = await fetch('/api/upload', { method: 'POST', body: fd });
      if (!resp.ok) {
        const { detail } = await resp.json().catch(() => ({}));
        throw new Error(detail || 'Error al subir');
      }
      const { url } = await resp.json();
      set('image', url);
    } catch (err) {
      setUploadErr(err.message);
    } finally {
      setUploading(false);
      e.target.value = '';
    }
  };

  const submit = async (e) => {
    e.preventDefault();
    setBusy(true);
    await onSave({ ...f, price: Number(f.price), tag: f.tag || null });
    setBusy(false);
  };

  const placeholder = window.sjpPlaceholder ? window.sjpPlaceholder(f.kind, f.code) : '';
  const previewSrc  = f.image || placeholder;

  return (
    <div className="adm-modal-bd" onClick={onClose}>
      <form className="adm-modal" onClick={e => e.stopPropagation()} onSubmit={submit}>
        <div className="adm-modal-h">
          <h3>◆ {isNew ? 'Nuevo producto' : 'Editar producto'}</h3>
          <button type="button" onClick={onClose}>×</button>
        </div>
        <div className="adm-modal-bod">

          {/* ── Foto ── */}
          <div className="full">
            <label>Foto del producto</label>
            <div style={{display:'flex', gap:20, alignItems:'flex-start'}}>
              {/* Preview */}
              <div
                onClick={() => !uploading && fileRef.current.click()}
                style={{
                  flexShrink: 0, width: 160, height: 120,
                  background: '#050505', border: '1px solid #1F1F1F',
                  backgroundImage: previewSrc ? `url("${previewSrc}")` : 'none',
                  backgroundSize: 'cover', backgroundPosition: 'center',
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                  cursor: uploading ? 'wait' : 'pointer', position: 'relative', overflow: 'hidden'
                }}
              >
                {!previewSrc && (
                  <span style={{color:'#3A3A3A', fontSize:11, fontFamily:'var(--f-mono)', letterSpacing:'0.1em'}}>
                    SIN FOTO
                  </span>
                )}
                {uploading && (
                  <div style={{
                    position:'absolute', inset:0, background:'rgba(0,0,0,0.7)',
                    display:'flex', alignItems:'center', justifyContent:'center',
                    fontFamily:'var(--f-mono)', fontSize:10, letterSpacing:'0.12em', color:'#FAFAF7'
                  }}>
                    SUBIENDO…
                  </div>
                )}
              </div>

              {/* Botones */}
              <div style={{display:'flex', flexDirection:'column', gap:8}}>
                <input
                  ref={fileRef}
                  type="file"
                  accept="image/jpeg,image/png,image/webp,image/gif"
                  style={{display:'none'}}
                  onChange={handleFile}
                />
                <button
                  type="button"
                  className="btn-admin"
                  disabled={uploading}
                  onClick={() => fileRef.current.click()}
                >
                  {uploading ? 'Subiendo…' : (f.image ? '↑ Cambiar foto' : '↑ Subir foto')}
                </button>
                {f.image && (
                  <button
                    type="button"
                    className="btn-admin ghost"
                    onClick={() => { set('image', ''); setUploadErr(''); }}
                  >
                    Quitar foto
                  </button>
                )}
                {uploadErr && (
                  <span style={{fontFamily:'var(--f-mono)', fontSize:10, color:'#DC1F1F', letterSpacing:'0.08em'}}>
                    ✗ {uploadErr}
                  </span>
                )}
                <span style={{fontFamily:'var(--f-mono)', fontSize:10, color:'#6A6A65', letterSpacing:'0.08em', marginTop:2}}>
                  JPG, PNG o WEBP
                </span>
              </div>
            </div>
          </div>

          {/* ── Campos ── */}
          <div>
            <label>Nombre *</label>
            <input required value={f.name} onChange={e => set('name', e.target.value)}/>
          </div>
          <div>
            <label>Código</label>
            <input value={f.code} onChange={e => set('code', e.target.value)}/>
          </div>
          <div>
            <label>Categoría</label>
            <select value={f.cat} onChange={e => set('cat', e.target.value)}>
              <option value="pecho">Pecho</option>
              <option value="espalda">Espalda</option>
              <option value="piernas">Piernas</option>
              <option value="antebrazos">Antebrazos</option>
            </select>
          </div>
          <div>
            <label>Tipo</label>
            <select value={f.kind} onChange={e => set('kind', e.target.value)}>
              <option value="press-banca">Press banca</option>
              <option value="rack">Rack</option>
              <option value="jaula-sentadilla">Jaula sentadilla</option>
              <option value="belt-squat">Belt squat</option>
              <option value="row-convergente">Row convergente</option>
              <option value="antebrazo">Antebrazo</option>
              <option value="generic">Genérico</option>
            </select>
          </div>
          <div>
            <label>Precio (€)</label>
            <input type="number" min="0" value={f.price} onChange={e => set('price', e.target.value)}/>
          </div>
          <div>
            <label>Etiqueta</label>
            <select value={f.tag || ''} onChange={e => set('tag', e.target.value)}>
              <option value="">Sin etiqueta</option>
              <option value="NUEVO">NUEVO</option>
              <option value="BESTSELLER">BESTSELLER</option>
              <option value="TOP">TOP</option>
              <option value="HECHO A MANO">HECHO A MANO</option>
            </select>
          </div>
          <div className="full">
            <label>Descripción</label>
            <textarea value={f.desc} onChange={e => set('desc', e.target.value)}/>
          </div>
          <div>
            <label style={{display:'flex', alignItems:'center', gap:10, cursor:'pointer'}}>
              <input type="checkbox" checked={!!f.video}
                onChange={e => set('video', e.target.checked)} style={{width:'auto'}}/>
              Tiene vídeo
            </label>
          </div>
          <div>
            <label style={{display:'flex', alignItems:'center', gap:10, cursor:'pointer'}}>
              <input type="checkbox" checked={!!f.featured}
                onChange={e => set('featured', e.target.checked)} style={{width:'auto'}}/>
              ⭐ Destacado en la home
            </label>
          </div>
        </div>
        <div className="adm-modal-f">
          <button type="button" className="btn-admin ghost" onClick={onClose}>Cancelar</button>
          <button type="submit" className="btn-admin" disabled={busy || uploading}>
            {busy ? 'Guardando…' : (isNew ? 'Crear producto' : 'Guardar cambios')}
          </button>
        </div>
      </form>
    </div>
  );
}

/* ── PRODUCTS TAB ───────────────────────────────────────────────────────── */
function ProductsTab({ data, loading, reload, toast }) {
  const [editing,  setEditing]  = useState(null);
  const [creating, setCreating] = useState(false);

  const enrichedProducts = (data.products || []).map(p => ({
    ...p,
    featured: (data.popular || []).includes(p.id)
  }));

  const onSave = async (prod) => {
    const exists = (data.products || []).find(p => p.id === prod.id);
    try {
      if (exists) {
        await api('PUT', `/api/products/${prod.id}`, prod);
        toast('✓ Producto actualizado', 'ok');
      } else {
        await api('POST', '/api/products', prod);
        toast('✓ Producto creado', 'ok');
      }
      setEditing(null);
      setCreating(false);
      await reload();
    } catch (e) {
      toast('✗ Error al guardar', 'err');
    }
  };

  const onDelete = async (id) => {
    if (!confirm('¿Borrar este producto?')) return;
    try {
      await api('DELETE', `/api/products/${id}`);
      toast('✓ Producto eliminado', 'ok');
      await reload();
    } catch (e) {
      toast('✗ Error al borrar', 'err');
    }
  };

  return (
    <div>
      <div className="section-h">
        <div>
          <h2>◆ Productos</h2>
          <div className="meta" style={{marginTop:8}}>
            {loading ? 'Cargando…' : `${(data.products||[]).length} ítems · ${(data.popular||[]).length} destacados`}
          </div>
        </div>
        <button className="btn-admin" onClick={() => setCreating(true)} disabled={loading}>
          + Nuevo producto
        </button>
      </div>

      {loading ? (
        <div className="loading">◆ Cargando catálogo…</div>
      ) : (
        <table className="prod-table">
          <thead>
            <tr>
              <th></th>
              <th>Código</th>
              <th>Nombre</th>
              <th>Cat.</th>
              <th>Precio</th>
              <th>Etiqueta</th>
              <th>⭐</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            {enrichedProducts.map(p => {
              const img = p.image || (window.sjpPlaceholder ? window.sjpPlaceholder(p.kind, p.code) : '');
              return (
                <tr key={p.id}>
                  <td><div className="thumb" style={{backgroundImage:`url("${img}")`}}/></td>
                  <td><span className="code">{p.code}</span></td>
                  <td><b>{p.name}</b></td>
                  <td>{p.cat}</td>
                  <td>{Number(p.price).toLocaleString('es-ES')} €</td>
                  <td>{p.tag || '—'}</td>
                  <td className="star">{p.featured ? '⭐' : ''}</td>
                  <td>
                    <div className="actions">
                      <button onClick={() => setEditing(p)}>Editar</button>
                      <button onClick={() => onDelete(p.id)}>Borrar</button>
                    </div>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      )}

      {(editing || creating) && (
        <ProductForm
          product={editing}
          onSave={onSave}
          onClose={() => { setEditing(null); setCreating(false); }}
        />
      )}
    </div>
  );
}

/* ── TEXTS TAB (localStorage — i18n only) ───────────────────────────────── */
const TEXTS_KEY = 'sjp-admin-texts';

function loadTexts() {
  try { const r = localStorage.getItem(TEXTS_KEY); if (r) return JSON.parse(r); } catch(_) {}
  return { es: {}, en: {} };
}
function saveTexts(d) { localStorage.setItem(TEXTS_KEY, JSON.stringify(d)); }

function TextsTab({ toast }) {
  const [q, setQ]               = useState('');
  const [overrides, setOverrides] = useState(loadTexts());

  if (!window.SJP_I18N) return <div className="empty">i18n.js no cargado</div>;

  const allKeys = Object.keys(window.SJP_I18N.es);
  const filtered = q.trim()
    ? allKeys.filter(k =>
        k.toLowerCase().includes(q.toLowerCase()) ||
        (window.SJP_I18N.es[k] || '').toLowerCase().includes(q.toLowerCase()))
    : allKeys;

  const updateText = (lang, key, value) => {
    const next = { ...overrides, [lang]: { ...overrides[lang], [key]: value } };
    if (!value || value === window.SJP_I18N[lang][key]) delete next[lang][key];
    setOverrides(next);
    saveTexts(next);
  };
  const reset = () => {
    if (!confirm('¿Restaurar todos los textos?')) return;
    const empty = { es: {}, en: {} };
    setOverrides(empty);
    saveTexts(empty);
    toast('✓ Textos restaurados', 'ok');
  };

  return (
    <div>
      <div className="section-h">
        <div>
          <h2>◆ Textos · ES / EN</h2>
          <div className="meta" style={{marginTop:8}}>{allKeys.length} claves · guardado en este navegador</div>
        </div>
        <button className="btn-admin danger" onClick={reset}>Restaurar todo</button>
      </div>
      <input className="texts-search" placeholder="Buscar clave o texto…"
        value={q} onChange={e => setQ(e.target.value)}/>
      <div className="texts-list">
        <div className="h">Clave</div>
        <div className="h">Español</div>
        <div className="h">English</div>
        {filtered.map(k => (
          <React.Fragment key={k}>
            <div className="c"><span className="key">{k}</span></div>
            <div className="c">
              <textarea
                defaultValue={overrides.es[k] !== undefined ? overrides.es[k] : (window.SJP_I18N.es[k] || '')}
                onBlur={e => updateText('es', k, e.target.value)}/>
            </div>
            <div className="c">
              <textarea
                defaultValue={overrides.en[k] !== undefined ? overrides.en[k] : (window.SJP_I18N.en[k] || '')}
                onBlur={e => updateText('en', k, e.target.value)}/>
            </div>
          </React.Fragment>
        ))}
        {filtered.length === 0 && <div className="empty" style={{gridColumn:'1 / -1'}}>Sin resultados</div>}
      </div>
    </div>
  );
}

/* ── SETTINGS TAB ───────────────────────────────────────────────────────── */
function SettingsTab({ data, toast }) {
  const exportAll = async () => {
    try {
      const prods = await api('GET', '/api/products');
      const blob  = new Blob([JSON.stringify(prods, null, 2)], { type: 'application/json' });
      const url   = URL.createObjectURL(blob);
      const a     = document.createElement('a');
      a.href      = url;
      a.download  = `sjp-backup-${Date.now()}.json`;
      a.click();
      URL.revokeObjectURL(url);
      toast('✓ Backup descargado', 'ok');
    } catch(_) {
      toast('✗ Error al exportar', 'err');
    }
  };

  return (
    <div>
      <div className="section-h">
        <div><h2>◆ Ajustes</h2><div className="meta" style={{marginTop:8}}>Backup y estado</div></div>
      </div>
      <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap: 16}}>
        <div style={{background:'#0A0A0A', border:'1px solid #1F1F1F', padding: 28}}>
          <h3 style={{fontSize:16, fontWeight:800, textTransform:'uppercase', letterSpacing:'-0.005em'}}>◆ Exportar catálogo</h3>
          <p style={{color:'#8A8A85', fontSize:13, margin:'12px 0 24px', lineHeight:1.55}}>
            Descarga un JSON con todos los productos tal como están en el servidor. Útil como backup.
          </p>
          <button className="btn-admin" onClick={exportAll}>Descargar backup</button>
        </div>
        <div style={{background:'#0A0A0A', border:'1px solid #1F1F1F', padding: 28}}>
          <h3 style={{fontSize:16, fontWeight:800, textTransform:'uppercase', letterSpacing:'-0.005em'}}>◆ URL pública</h3>
          <p style={{color:'#8A8A85', fontSize:13, margin:'12px 0 8px', lineHeight:1.55}}>
            Web pública del catálogo:
          </p>
          <code style={{fontFamily:'var(--f-mono)', fontSize:11, color:'#DC1F1F', display:'block', marginBottom:8}}>
            {window.location.origin}/
          </code>
          <a href="/" target="_blank" className="btn-admin ghost" style={{marginTop:8, textDecoration:'none'}}>
            Abrir web pública ↗
          </a>
        </div>
      </div>
      <div style={{marginTop: 32, padding: 24, background:'#0A0A0A', border:'1px solid #1F1F1F'}}>
        <div style={{fontFamily:'var(--f-mono)', fontSize: 10, letterSpacing:'0.14em', color:'#8A8A85', textTransform:'uppercase', marginBottom: 12}}>◆ Estado del servidor</div>
        <div style={{display:'flex', gap: 32, flexWrap:'wrap'}}>
          <div>
            <b style={{fontSize: 28}}>{(data.products||[]).length}</b>
            <small style={{color:'#8A8A85', fontSize:11, fontFamily:'var(--f-mono)', letterSpacing:'0.1em', marginLeft: 6}}>productos</small>
          </div>
          <div>
            <b style={{fontSize: 28}}>{(data.categories||[]).filter(c => c.id !== 'all').length}</b>
            <small style={{color:'#8A8A85', fontSize:11, fontFamily:'var(--f-mono)', letterSpacing:'0.1em', marginLeft: 6}}>categorías</small>
          </div>
          <div>
            <b style={{fontSize: 28}}>{(data.popular||[]).length}</b>
            <small style={{color:'#8A8A85', fontSize:11, fontFamily:'var(--f-mono)', letterSpacing:'0.1em', marginLeft: 6}}>destacados</small>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ── MAIN ADMIN SHELL ───────────────────────────────────────────────────── */
function Admin({ onOut }) {
  const [tab,      setTab]     = useState('products');
  const [data,     setData]    = useState({ products: [], categories: [], popular: [] });
  const [loading,  setLoading] = useState(true);
  const [toastMsg, setToast]   = useState(null);

  const showToast = (msg, type = 'ok') => {
    setToast({ msg, type });
    setTimeout(() => setToast(null), 2500);
  };

  const reload = useCallback(async () => {
    setLoading(true);
    try {
      const d = await api('GET', '/api/products');
      setData(d);
    } catch (_) {
      showToast('✗ Error cargando datos', 'err');
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => { reload(); }, [reload]);

  const logout = () => { onOut(); };

  return (
    <div className="admin-shell">
      <div className="admin-top">
        <div className="brand">
          <div className="mk">S</div>
          <div>
            <b>SJP · Admin Panel</b>
            <small>Cambios guardados en el servidor</small>
          </div>
        </div>
        <div className="actions">
          <a href="/" className="btn-admin ghost" target="_blank" rel="noopener">Ver web ↗</a>
          <button className="btn-admin danger" onClick={logout}>Cerrar sesión</button>
        </div>
      </div>

      <div className="admin-tabs">
        <button className={tab==='products' ? 'on' : ''} onClick={() => setTab('products')}>◆ Productos</button>
        <button className={tab==='texts'    ? 'on' : ''} onClick={() => setTab('texts')}>◆ Textos</button>
        <button className={tab==='settings' ? 'on' : ''} onClick={() => setTab('settings')}>◆ Ajustes</button>
      </div>

      <div className="admin-body">
        {tab === 'products' && (
          <ProductsTab data={data} loading={loading} reload={reload} toast={showToast}/>
        )}
        {tab === 'texts' && (
          <TextsTab toast={showToast}/>
        )}
        {tab === 'settings' && (
          <SettingsTab data={data} toast={showToast}/>
        )}
      </div>

      {toastMsg && (
        <div className={`toast ${toastMsg.type}`}>{toastMsg.msg}</div>
      )}
    </div>
  );
}

/* ── ROOT ───────────────────────────────────────────────────────────────── */
function Root() {
  return <Admin onOut={() => {}}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script>
